name: Pac-Man de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 3h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gera o Pac-Man com as contribuições do último ano
        run: node scripts/pacman.mjs "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salva se mudou
        run: |
          if git diff --quiet -- assets; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman.svg assets/pacman-dark.svg
          git commit -m "Atualiza o Pac-Man de contribuições"
          git push
