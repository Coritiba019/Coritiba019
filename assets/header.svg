<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fabio Dias, Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>

  <text x="70" y="98" class="mono" font-size="18" fill="#7dd3fc">&lt;olá mundo /&gt;</text>
  <text x="68" y="160" class="t" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Fabio Dias</text>
  <rect x="70" y="178" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="220" class="t" font-size="24" font-weight="600" fill="#cbd5e1">Desenvolvedor Full Stack</text>
  <text x="70" y="252" class="t" font-size="17" fill="#94a3b8">Python · TypeScript · NestJS · Django · React · Next.js</text>

  <g class="float" transform="translate(760 62)">
    <rect width="370" height="176" rx="14" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="6" fill="#f87171"/>
    <circle cx="42" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="22" r="6" fill="#34d399"/>
    <text x="22" y="66" class="mono" font-size="15" fill="#c084fc">const<tspan fill="#e2e8f0"> fabio </tspan><tspan fill="#94a3b8">= {</tspan></text>
    <text x="42" y="92" class="mono" font-size="15" fill="#7dd3fc">foco<tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"SaaS em produção"</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="42" y="118" class="mono" font-size="15" fill="#7dd3fc">base<tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"São Paulo, BR"</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="42" y="144" class="mono" font-size="15" fill="#7dd3fc">anos<tspan fill="#94a3b8">: </tspan><tspan fill="#fdba74">6</tspan><tspan fill="#94a3b8">+</tspan></text>
    <text x="22" y="166" class="mono" font-size="15" fill="#94a3b8">}<tspan class="cursor" fill="#e2e8f0">▍</tspan></text>
  </g>
</svg>
